spec:
  inputs:
    brave_version:
      type: string
      default: ""
      description: "Brave release version. Leave empty to auto-fetch latest stable from GitHub."
    force_cache_rebuild:
      type: boolean
      default: false
      description: "Force cold build and rebuild cache package in registry"
    compile_target:
      type: string
      default: "all"
      description: "Target platform to compile (all, android, windows, windows_x64, windows_arm64)"
---
# Windows Pipeline Jobs
# Included by .gitlab-ci.yml

.prepare_windows_cache_base:
  stage: cache_prep
  extends:
    - .linux_2xlarge
    - .build_environment_setup
  needs:
    - job: prepare_source
      artifacts: true
  variables:
    CACHE_PREP_ONLY: "true"
    BUILD_TARGET: "v8 third_party/blink/public:blink"
  cache:
    key: "braving-source-${CI_COMMIT_REF_SLUG}"
    paths:
      - build-workspace/src/brave/
    policy: pull
  script:
    - export FORCE_CACHE_REBUILD="${FORCE_CACHE_REBUILD:-$[[ inputs.force_cache_rebuild ]]}"
    - export CACHE_VERSION="${DYNAMIC_BRAVE_VERSION:-${BRAVE_VERSION}}-win-${TARGET_ARCH}"
    - |
      if [ "${FORCE_CACHE_REBUILD}" == "true" ]; then
        echo "FORCE_CACHE_REBUILD is true. Forcing a cold build."
      else
        echo "Checking if Windows cache ${CACHE_VERSION} exists in the Packages API..."
        if curl -s --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages?package_type=generic&package_name=braving-cache" | grep -q "\"version\":\"${CACHE_VERSION}\""; then
          echo "Cache ${CACHE_VERSION} already exists in registry! Skipping Stage 2."
          exit 0
        fi
      fi
    - echo "Building isolated Windows heavy targets (v8 & blink) for ${TARGET_ARCH} to generate warm cache..."
    - ./scripts/platforms/windows/build.sh --manifest="metadata/releases/${DYNAMIC_BRAVE_VERSION}.yaml" --arch="${TARGET_ARCH}" --release
    - CACHE_VERSION="${CACHE_VERSION}" ./scripts/core/upload-cache.sh
  artifacts:
    name: "braving-win-cache-logs-${DYNAMIC_BRAVE_VERSION}"
    when: always
    paths:
      - build-workspace/build-artifacts.tar.xz
    expire_in: 2 days

.build_windows_base:
  stage: build
  extends:
    - .linux_2xlarge
    - .build_environment_setup
  cache:
    key: "braving-source-${CI_COMMIT_REF_SLUG}"
    paths:
      - build-workspace/src/brave/
    policy: pull
  script:
    - export CACHE_VERSION="${DYNAMIC_BRAVE_VERSION:-${BRAVE_VERSION}}-win-${TARGET_ARCH}"
    - echo "Restoring warm Windows cache for ${CACHE_VERSION}..."
    - CACHE_VERSION="${CACHE_VERSION}" ./scripts/core/download-cache.sh || true
    - echo "Executing Windows compile and package for release manifest metadata/releases/${DYNAMIC_BRAVE_VERSION}.yaml"
    - ./scripts/platforms/windows/build.sh --manifest="metadata/releases/${DYNAMIC_BRAVE_VERSION}.yaml" --arch="${TARGET_ARCH}" --release --package
  artifacts:
    name: "braving-windows-${TARGET_ARCH}-${DYNAMIC_BRAVE_VERSION}"
    when: always
    paths:
      - out/packages/
      - build-workspace/build-artifacts.tar.xz
      - metadata/releases/*.yaml
      - metadata/upstream-*.yaml
    expire_in: 30 days

# ------------------------------------------------------------------------------
# Windows Cache & Build Jobs: x64 and arm64 targets
# ------------------------------------------------------------------------------
prepare_windows_cache_x64:
  extends: .prepare_windows_cache_base
  variables:
    TARGET_ARCH: "x64"
  rules:
    - if: '$SKIP_BUILD == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "release"'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "web" && ($COMPILE_TARGET == "all" || $COMPILE_TARGET == "windows" || $COMPILE_TARGET == "windows_x64")'
      when: on_success
    - when: never

prepare_windows_cache_arm64:
  extends: .prepare_windows_cache_base
  variables:
    TARGET_ARCH: "arm64"
  rules:
    - if: '$SKIP_BUILD == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "release"'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "web" && ($COMPILE_TARGET == "all" || $COMPILE_TARGET == "windows" || $COMPILE_TARGET == "windows_arm64")'
      when: on_success
    - when: never

build_windows_x64:
  extends: .build_windows_base
  variables:
    TARGET_ARCH: "x64"
  needs:
    - job: prepare_windows_cache_x64
      artifacts: true
      optional: true
    - job: prepare_source
      artifacts: true
  rules:
    - if: '$SKIP_BUILD == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "release"'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "web" && ($COMPILE_TARGET == "all" || $COMPILE_TARGET == "windows" || $COMPILE_TARGET == "windows_x64")'
      when: on_success
    - when: never

build_windows_arm64:
  extends: .build_windows_base
  variables:
    TARGET_ARCH: "arm64"
  needs:
    - job: prepare_windows_cache_arm64
      artifacts: true
      optional: true
    - job: prepare_source
      artifacts: true
  rules:
    - if: '$SKIP_BUILD == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "release"'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "web" && ($COMPILE_TARGET == "all" || $COMPILE_TARGET == "windows" || $COMPILE_TARGET == "windows_arm64")'
      when: on_success
    - when: never
