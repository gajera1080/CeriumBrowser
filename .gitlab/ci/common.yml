spec:
  inputs:
    brave_version:
      type: string
      default: ""
      description: "Brave release version. Leave empty to auto-fetch latest stable from GitHub."
    compile_target:
      type: string
      default: "all"
      description: "Target platform to compile (all, android, windows, windows_x64, windows_arm64)"
---
# Common Templates, Source Preparation, and Unified Release Stage
# Included by .gitlab-ci.yml

.linux_2xlarge:
  image: debian:bookworm
  tags:
    - saas-linux-2xlarge-amd64
  variables:
    GIT_STRATEGY: fetch
    WORKSPACE_DIR: "${CI_PROJECT_DIR}/build-workspace"
    GCLIENT_SUPPRESS_GIT_VERSION_WARNING: "1"

.build_environment_setup:
  cache:
    key: "cerium-src-$CI_PIPELINE_ID"
    paths:
      - build-workspace/src/brave/
    policy: pull
  before_script:
    - 'if [ -z "${DYNAMIC_BRAVE_VERSION:-}" ]; then echo "ERROR: DYNAMIC_BRAVE_VERSION is missing from build.env."; exit 1; fi'
    - apt-get update -qq && apt-get install -y -qq git python3 python3-yaml curl patch ca-certificates openjdk-17-jdk ninja-build bzip2 sudo file lsb-release pkg-config zip libfuse2
    - export GCLIENT_SUPPRESS_GIT_VERSION_WARNING=1
    - curl -fsSL https://deb.nodesource.com/setup_24.x | bash - && apt-get install -y -qq nodejs
    - npm install -g pnpm@11.11.0

prepare_source:
  stage: prepare
  image: debian:bookworm-slim
  cache:
    key: "cerium-src-$CI_PIPELINE_ID"
    paths:
      - build-workspace/src/brave/
    policy: push
  before_script:
    - apt-get update -qq && apt-get install -y -qq git python3 python3-yaml curl patch ca-certificates
  script:
    - export BRAVE_VERSION="${BRAVE_VERSION:-$[[ inputs.brave_version ]]}"
    - export FORCE_CACHE_REBUILD="${FORCE_CACHE_REBUILD:-false}"
    - echo "Preparing Cerium source in RELEASE MODE for Brave version ${BRAVE_VERSION}"
    - ./scripts/core/prepare-source.sh "${BRAVE_VERSION}"
    - ./scripts/core/verify-all.sh
    - BUILD_ENV_FILE=build.env ./scripts/ci/check-release-needed.sh
  artifacts:
    name: "cerium-prepared-${BRAVE_VERSION}"
    paths:
      - metadata/releases/*.yaml
      - metadata/upstream-*.yaml
      - branding/
    reports:
      dotenv: build.env
    expire_in: 2 days

publish_release:
  stage: publish
  image: debian:bookworm-slim
  needs:
    - job: build_android
      artifacts: true
      optional: true
    - job: build_windows_x64
      artifacts: true
      optional: true
    - job: build_windows_arm64
      artifacts: true
      optional: true
    - job: prepare_source
      artifacts: true
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl python3 ca-certificates
  script:
    - echo "Publishing official release v${DYNAMIC_BRAVE_VERSION}..."
    - ./scripts/ci/publish-release-direct.sh
  artifacts:
    name: "cerium-release-${DYNAMIC_BRAVE_VERSION}"
    when: on_success
    paths:
      - out/apks/
      - out/packages/
      - metadata/releases/*.yaml
      - metadata/upstream-*.yaml
    expire_in: 90 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "release"'
      when: on_success
    - when: never
