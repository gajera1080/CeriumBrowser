spec:
  inputs:
    brave_version:
      type: string
      default: ""
      description: "Brave release version. Leave empty to auto-fetch latest stable from GitHub."
    force_cache_rebuild:
      type: boolean
      default: false
      description: "Force cold build and rebuild cache package in registry"
---
# Common Templates, Source Preparation, and Unified Release Stage
# Included by .gitlab-ci.yml

.linux_2xlarge:
  image: debian:bookworm
  tags:
    - saas-linux-2xlarge-amd64
  variables:
    GIT_STRATEGY: fetch
    WORKSPACE_DIR: "${CI_PROJECT_DIR}/build-workspace"

.build_environment_setup:
  before_script:
    - 'if [ -z "${DYNAMIC_BRAVE_VERSION:-}" ]; then echo "ERROR: DYNAMIC_BRAVE_VERSION is missing from build.env."; exit 1; fi'
    - apt-get update -qq && apt-get install -y -qq git python3 python3-yaml curl patch ca-certificates openjdk-17-jdk ninja-build bzip2 sudo file lsb-release xz-utils pkg-config zip
    - curl -fsSL https://deb.nodesource.com/setup_24.x | bash - && apt-get install -y -qq nodejs
    - npm install -g pnpm@11.11.0

prepare_source:
  stage: prepare
  image: debian:bookworm-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq git python3 python3-yaml curl patch ca-certificates
  script:
    - touch build.env
    - export BRAVE_VERSION="${BRAVE_VERSION:-$[[ inputs.brave_version ]]}"
    - export FORCE_CACHE_REBUILD="${FORCE_CACHE_REBUILD:-$[[ inputs.force_cache_rebuild ]]}"
    - echo "Preparing Braving source in RELEASE MODE for Brave version ${BRAVE_VERSION}"
    - ./scripts/android/prepare-source.sh "${BRAVE_VERSION}"
    - ./scripts/android/verify-all.sh
    - |
      export DYNAMIC_BRAVE_VERSION=$(ls metadata/releases/ | grep '\.yaml$' | sed 's/\.yaml$//' | head -n 1)
      if ! DYNAMIC_CHROMIUM_VERSION="$(python3 -c "import sys, yaml; print(yaml.safe_load(open(f'metadata/releases/{sys.argv[1]}.yaml'))['chromium_version'])" "${DYNAMIC_BRAVE_VERSION}")"; then
        echo "ERROR: Failed to read DYNAMIC_CHROMIUM_VERSION from the release manifest." >&2
        exit 1
      fi
      if [ -z "${DYNAMIC_CHROMIUM_VERSION}" ]; then
        echo "ERROR: DYNAMIC_CHROMIUM_VERSION is empty." >&2
        exit 1
      fi
      export DYNAMIC_CHROMIUM_VERSION
      echo "DYNAMIC_BRAVE_VERSION=${DYNAMIC_BRAVE_VERSION}" > build.env
      echo "DYNAMIC_CHROMIUM_VERSION=${DYNAMIC_CHROMIUM_VERSION}" >> build.env
      echo "TARGET_PLATFORM=all" >> build.env
      echo "TARGET_ARCH=all" >> build.env
    - BUILD_ENV_FILE=build.env ./scripts/ci/check-release-needed.sh
  cache:
    key: "braving-source-${CI_COMMIT_REF_SLUG}-${BRAVE_VERSION}"
    paths:
      - build-workspace/src/brave/
  artifacts:
    name: "braving-prepared-${BRAVE_VERSION}"
    paths:
      - metadata/releases/*.yaml
      - metadata/upstream-*.yaml
      - branding/
    reports:
      dotenv: build.env
    expire_in: 2 days

publish_release:
  stage: publish
  image: debian:bookworm-slim
  needs:
    - job: build_android
      artifacts: true
    - job: build_windows
      artifacts: true
    - job: prepare_source
      artifacts: true
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl python3 ca-certificates
  script:
    - echo "Publishing official multi-architecture release v${DYNAMIC_BRAVE_VERSION}..."
    - ./scripts/ci/publish-release-direct.sh
  artifacts:
    name: "braving-release-${DYNAMIC_BRAVE_VERSION}"
    when: on_success
    paths:
      - out/apks/
      - out/packages/
      - metadata/releases/*.yaml
      - metadata/upstream-*.yaml
    expire_in: 90 days
  rules:
    - if: '$SKIP_BUILD == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "release" || $CI_PIPELINE_SOURCE == "web"'
