spec:
  inputs:
    brave_version:
      type: string
      default: ""
      description: "Brave release version. Leave empty to auto-fetch latest stable from GitHub."
    compile_target:
      type: string
      default: "all"
      description: "Target platform to compile (all, android, windows, windows_x64, windows_arm64)"
---
# Common Templates, Source Preparation, and Unified Release Stage
# Included by .gitlab-ci.yml

.linux_2xlarge:
  image: debian:bookworm
  tags:
    - saas-linux-2xlarge-amd64
  variables:
    GIT_STRATEGY: fetch
    WORKSPACE_DIR: "${CI_PROJECT_DIR}/build-workspace"

.build_environment_setup:
  before_script:
    - 'if [ -z "${DYNAMIC_BRAVE_VERSION:-}" ]; then echo "ERROR: DYNAMIC_BRAVE_VERSION is missing from build.env."; exit 1; fi'
    - apt-get update -qq && apt-get install -y -qq git python3 python3-yaml curl patch ca-certificates openjdk-17-jdk ninja-build bzip2 sudo file lsb-release xz-utils pkg-config zip
    - curl -fsSL https://deb.nodesource.com/setup_24.x | bash - && apt-get install -y -qq nodejs
    - npm install -g pnpm@11.11.0
    - |
      WORKSPACE_DIR="${WORKSPACE_DIR:-${CI_PROJECT_DIR:-$PWD}/build-workspace}"
      if [ ! -d "${WORKSPACE_DIR}/src/brave" ]; then
        BRAVE_ARCHIVE=""
        if [ -n "${DYNAMIC_BRAVE_VERSION:-}" ] && [ -f "${WORKSPACE_DIR}/brave-src-${DYNAMIC_BRAVE_VERSION}.tar.gz" ]; then
          BRAVE_ARCHIVE="${WORKSPACE_DIR}/brave-src-${DYNAMIC_BRAVE_VERSION}.tar.gz"
        else
          BRAVE_ARCHIVE=$(ls -1 "${WORKSPACE_DIR}"/brave-src-*.tar.gz 2>/dev/null | head -n 1 || true)
        fi
        if [ -n "${BRAVE_ARCHIVE}" ] && [ -f "${BRAVE_ARCHIVE}" ]; then
          echo "Unpacking prepared brave-core from ${BRAVE_ARCHIVE}..."
          mkdir -p "${WORKSPACE_DIR}/src"
          tar -xzf "${BRAVE_ARCHIVE}" -C "${WORKSPACE_DIR}/src"
          rm -f "${BRAVE_ARCHIVE}"
          if [ ! -d "${WORKSPACE_DIR}/src/brave/.git" ]; then
            git -C "${WORKSPACE_DIR}/src/brave" init -q
            git -C "${WORKSPACE_DIR}/src/brave" config user.name "Braving"
            git -C "${WORKSPACE_DIR}/src/brave" config user.email "ci@braving.org"
            git -C "${WORKSPACE_DIR}/src/brave" commit --allow-empty -m "Prepared brave-core" --no-gpg-sign -q
          fi
          echo "brave-core unpacked successfully."
        fi
      fi

prepare_source:
  stage: prepare
  image: debian:bookworm-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq git python3 python3-yaml curl patch ca-certificates xz-utils
  script:
    - export BRAVE_VERSION="${BRAVE_VERSION:-$[[ inputs.brave_version ]]}"
    - export FORCE_CACHE_REBUILD="${FORCE_CACHE_REBUILD:-false}"
    - echo "Preparing Braving source in RELEASE MODE for Brave version ${BRAVE_VERSION}"
    - ./scripts/core/prepare-source.sh "${BRAVE_VERSION}"
    - ./scripts/core/verify-all.sh
    - BUILD_ENV_FILE=build.env ./scripts/ci/check-release-needed.sh
  artifacts:
    name: "braving-prepared-${BRAVE_VERSION}"
    paths:
      - metadata/releases/*.yaml
      - metadata/upstream-*.yaml
      - branding/
      - build-workspace/brave-src-*.tar.gz
    reports:
      dotenv: build.env
    expire_in: 2 days

publish_release:
  stage: publish
  image: debian:bookworm-slim
  needs:
    - job: build_android
      artifacts: true
      optional: true
    - job: build_windows_x64
      artifacts: true
      optional: true
    - job: build_windows_arm64
      artifacts: true
      optional: true
    - job: prepare_source
      artifacts: true
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl python3 ca-certificates
  script:
    - echo "Publishing official multi-architecture release v${DYNAMIC_BRAVE_VERSION}..."
    - ./scripts/ci/publish-release-direct.sh
  artifacts:
    name: "braving-release-${DYNAMIC_BRAVE_VERSION}"
    when: on_success
    paths:
      - out/apks/
      - out/packages/
      - metadata/releases/*.yaml
      - metadata/upstream-*.yaml
    expire_in: 90 days
  rules:
    - if: '$SKIP_BUILD == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "release"'
      when: on_success
    - when: never
