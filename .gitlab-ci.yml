# GitLab CI Pipeline for Braving Android
# RELEASE MODE: BRAVE_VERSION -> exact matching brave-core release -> exact pinned Chromium
# Builds minimal Chromium + Brave Shields with custom Braving branding

stages:
  - prepare
  - cache_prep
  - build

variables:
  GIT_DEPTH: 1
  BRAVE_VERSION:
    value: "1.94.120"
    description: "Exact Brave release version (e.g. 1.94.120). Enforces deterministic brave-core + Chromium resolution."
  TARGET_ARCH:
    value: "arm64"
    description: "Target Android architecture: arm64, arm, x86_64"

# ----------------------------------------------------
# Stage 1: Source Preparation (Phase 1)
# ----------------------------------------------------
prepare_source:
  stage: prepare
  image: debian:bookworm-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq git python3 python3-yaml curl patch ca-certificates python3-pil
  script:
    - echo "Preparing Braving source in RELEASE MODE for Brave version ${BRAVE_VERSION}"
    - ./scripts/generate-icons.sh
    - ./scripts/prepare-source.sh "${BRAVE_VERSION}"
    - ./scripts/verify-all.sh
  cache:
    key: "braving-source-${BRAVE_VERSION}-${CI_COMMIT_SHA}"
    paths:
      - build-workspace/src/brave/
  artifacts:
    name: "braving-prepared-${BRAVE_VERSION}"
    paths:
      - metadata/releases/${BRAVE_VERSION}.yaml
      - metadata/upstream-${BRAVE_VERSION}.yaml
      - branding/
    expire_in: 7 days

# ----------------------------------------------------
# Stage 2: Cache Preparation (Build Heavy Sub-targets)
# ----------------------------------------------------
prepare_chromium_cache:
  stage: cache_prep
  image: debian:bookworm
  tags:
    - saas-linux-2xlarge-amd64
  needs:
    - job: prepare_source
      artifacts: true
  cache:
    key: "braving-source-${BRAVE_VERSION}-${CI_COMMIT_SHA}"
    paths:
      - build-workspace/src/brave/
    policy: pull
  variables:
    GIT_STRATEGY: fetch
    WORKSPACE_DIR: "${CI_PROJECT_DIR}/build-workspace"
    CACHE_PREP_ONLY: "true"
    BUILD_TARGET: "v8 third_party/blink/public:blink"
  before_script:
    - apt-get update -qq && apt-get install -y -qq git python3 python3-yaml curl patch ca-certificates openjdk-17-jdk ninja-build bzip2 sudo file lsb-release xz-utils pkg-config
    - curl -fsSL https://deb.nodesource.com/setup_24.x | bash - && apt-get install -y -qq nodejs
    - npm install -g pnpm@11.11.0
  script:
    - echo "Building isolated heavy targets (v8 & blink) to generate warm cache..."
    - ./scripts/build-android.sh --manifest="metadata/releases/${BRAVE_VERSION}.yaml" --arch="${TARGET_ARCH}" --release
    - ./scripts/upload-cache.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_PIPELINE_SOURCE == "web"'

# ----------------------------------------------------
# Stage 3: Android Build (Phase 2 on Large Runner)
# ----------------------------------------------------
build_android:
  stage: build
  image: debian:bookworm
  tags:
    - saas-linux-2xlarge-amd64
  needs:
    - job: prepare_chromium_cache
      artifacts: true
  cache:
    key: "braving-source-${BRAVE_VERSION}-${CI_COMMIT_SHA}"
    paths:
      - build-workspace/src/brave/
    policy: pull
  variables:
    GIT_STRATEGY: fetch
    WORKSPACE_DIR: "${CI_PROJECT_DIR}/build-workspace"
  before_script:
    - apt-get update -qq && apt-get install -y -qq git python3 python3-yaml curl patch ca-certificates openjdk-17-jdk ninja-build bzip2 sudo file lsb-release xz-utils pkg-config
    - curl -fsSL https://deb.nodesource.com/setup_24.x | bash - && apt-get install -y -qq nodejs
    - npm install -g pnpm@11.11.0
  script:
    - echo "Executing Android compile for release manifest metadata/releases/${BRAVE_VERSION}.yaml"
    - ./scripts/build-android.sh --manifest="metadata/releases/${BRAVE_VERSION}.yaml" --arch="${TARGET_ARCH}" --release
  artifacts:
    name: "braving-android-${TARGET_ARCH}-${BRAVE_VERSION}"
    when: always
    paths:
      - out/apks/*.apk
      - metadata/releases/${BRAVE_VERSION}.yaml
      - build-workspace/build.log
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_PIPELINE_SOURCE == "web"'
