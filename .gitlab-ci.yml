spec:
  inputs:
    brave_version:
      type: string
      default: ""
      description: "Brave release version (e.g. <version>). Leave empty to auto-fetch latest stable from GitHub."
    compile_target:
      type: string
      default: "all"
      options:
        - "all"
        - "android"
        - "windows"
        - "windows_x64"
        - "windows_arm64"
      description: "Select target to compile (all, android, windows, windows_x64, windows_arm64)"
---
# GitLab CI Pipeline for Braving Multi-Platform Distribution
# Unified architecture building Android (arm64), Windows (x64), and Windows (arm64)
# - Release branch builds all targets automatically and publishes official release
# - Non-release branches provide interactive selection of compile target via GitLab inputs

stages:
  - prepare
  - cache_prep
  - build
  - publish

variables:
  GIT_DEPTH: 1
  BRAVE_VERSION: "$[[ inputs.brave_version ]]"
  FORCE_CACHE_REBUILD: "${FORCE_CACHE_REBUILD:-false}"
  COMPILE_TARGET: "$[[ inputs.compile_target ]]"
  GCLIENT_SUPPRESS_GIT_VERSION_WARNING: "1"

# Pipeline execution rules:
# - release branch triggers on any push/merge to build all architectures and publish official release
# - manual Web UI execution triggers configurable target compilation
workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "release"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: always
    - when: never

# Modular includes with inputs propagation
include:
  - local: ".gitlab/ci/common.yml"
    inputs:
      brave_version: "$[[ inputs.brave_version ]]"
      compile_target: "$[[ inputs.compile_target ]]"
  - local: ".gitlab/ci/android.yml"
    inputs:
      brave_version: "$[[ inputs.brave_version ]]"
      compile_target: "$[[ inputs.compile_target ]]"
  - local: ".gitlab/ci/windows.yml"
    inputs:
      brave_version: "$[[ inputs.brave_version ]]"
      compile_target: "$[[ inputs.compile_target ]]"
